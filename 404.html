<script>
  // Light/Dark switch: flips the current look and remembers it.
  (function () {
    var d = document.documentElement, btn = document.querySelector('.theme');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var dark = d.getAttribute('data-theme') ? d.getAttribute('data-theme') === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = dark ? 'light' : 'dark';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', next === 'dark' ? '#0A0A0A' : '#EEEDEA'); });
    });
  })();
</script>
